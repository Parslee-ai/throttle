name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (Release)
        run: scripts/build.sh

      - name: Test
        env:
          # The source-audit tests read the checkout; on a runner there is no
          # privacy prompt, so run them. Locally they skip under ~/Documents.
          TEST_RUNNER_THROTTLE_REPO_AUDIT: "1"
        run: scripts/test.sh
